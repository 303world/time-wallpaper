name: Build APK

# 手动触发 / 推送 main / 打 tag 时编译 release APK。
# 仓库是 public 的，Actions 在标准 runner 上不计费。

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/timewallpaper.jks
            {
              echo "TW_STORE_FILE=keystore/timewallpaper.jks"
              echo "TW_STORE_PASSWORD=$STORE_PASSWORD"
              echo "TW_KEY_ALIAS=$KEY_ALIAS"
              echo "TW_KEY_PASSWORD=$KEY_PASSWORD"
            } >> local.properties
            echo "signed=true" >> "$GITHUB_ENV"
          else
            echo "::warning::没有配置签名 secret，产物是 unsigned APK，需要本地 apksigner 签名后才能安装覆盖旧版。"
            echo "signed=false" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Show output
        run: |
          ls -lh app/build/outputs/apk/release/
          for f in app/build/outputs/apk/release/*.apk; do
            echo "== $f"
            "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" dump badging "$f" 2>/dev/null | head -3 || true
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: timewallpaper-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
